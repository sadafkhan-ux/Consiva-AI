[project]
name = "consiva-backend"
version = "0.1.0"
description = "Consiva DPDP compliance platform backend — Consent Agent (phase 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",  # langgraph-checkpoint-postgres needs a psycopg3 wrapper; bare psycopg needs system libpq
    "openai>=1.54",
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tldextract>=5.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pypdf>=5.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "PyJWT>=2.9",
    "bcrypt>=4.1",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends()-in-default-argument is the framework's own idiom, not a bug.
ignore = ["B008"]

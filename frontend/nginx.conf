# Serves the built Vite SPA and reverse-proxies the API to the backend container.
#
# Why proxy instead of pointing the browser at the backend directly: the fetch() calls
# originate in the USER'S BROWSER, outside the compose network, so a Docker service
# hostname like http://backend:8000 is unresolvable there. Proxying under the same
# origin the app is served from fixes that, and as a side effect means no cross-origin
# request is ever made — so the backend's CORS middleware is not involved at all.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Vite emits content-hashed filenames, so built assets are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API -> backend service on the internal compose network. The backend is NOT
    # published to the host in docker-compose.prod.yml; this is its only route in.
    #
    # The backend's address is looked up again every few seconds (Docker's own resolver, 127.0.0.11) instead of once when nginx starts. With a fixed `proxy_pass http://backend:8000;` nginx
    # keeps the address it found at start-up, so recreating the backend container (a rebuild, a restart on a new address) left every /api request answering 502 Bad Gateway until the frontend
    # was restarted too. That was the "Request failed with status 502" in the Policy Knowledge Base panel. With a variable, a request URI that is passed on unchanged still is.
    location /api/ {
        resolver           127.0.0.11 valid=5s ipv6=off;
        set                $api_upstream http://backend:8000;
        proxy_pass         $api_upstream;
        # Evidence pushes (DSR, ROPA) are accepted up to 10 MiB by the API; nginx's own default of 1m refused anything larger before it arrived.
        client_max_body_size 12m;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A real scan+analyze round trip is long-running (website_scan alone has been
        # measured at 20-80s, and llm_analysis has its own 480s wall-clock budget), so
        # the default 60s proxy timeout would cut off legitimate in-flight requests.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering       off;
    }

    # The backend's own root-level endpoints: OpenAPI schema, Swagger UI, and the
    # container health probe.
    #
    # These are NOT under /api/, so without this block the SPA fallback below swallows
    # them and returns index.html with a 200 -- worse than a 404, because anything
    # checking them sees "success". Verified against the live deployment: GET /health
    # returned the single-page app's HTML, GET /docs returned the same, and the API
    # documentation handed to the integrating team pointed at a URL that rendered the
    # console instead of the schema.
    #
    # Each of these resolves the backend's address again every few seconds, exactly like /api/ above, and for the same reason: with a fixed `proxy_pass http://backend:8000/...;` nginx
    # keeps the address it found at start-up, so recreating the backend left /health, /docs and /openapi.json answering 502 until nginx was reloaded. `proxy_pass $api_upstream;` has no URI
    # part, so the request's own URI (/health, /docs, /docs/oauth2-redirect, /openapi.json, /redoc) is passed on unchanged.
    location = /health {
        resolver           127.0.0.11 valid=5s ipv6=off;
        set                $api_upstream http://backend:8000;
        proxy_pass         $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    location = /openapi.json {
        resolver           127.0.0.11 valid=5s ipv6=off;
        set                $api_upstream http://backend:8000;
        proxy_pass         $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        resolver           127.0.0.11 valid=5s ipv6=off;
        set                $api_upstream http://backend:8000;
        proxy_pass         $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI fetches its own CSS/JS from under this path.
    location /docs/ {
        resolver           127.0.0.11 valid=5s ipv6=off;
        set                $api_upstream http://backend:8000;
        proxy_pass         $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        resolver           127.0.0.11 valid=5s ipv6=off;
        set                $api_upstream http://backend:8000;
        proxy_pass         $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history fallback: any non-asset path serves index.html so client-side
    # routing works on refresh/deep-link.
    location / {
        # index.html names the current build's hashed bundles, so it must be revalidated
        # on every load. Without this, browsers cache it heuristically and keep asking
        # for bundles a redeploy has already removed.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Serves the built Vite SPA and reverse-proxies the API to the backend container.
#
# Why proxy instead of pointing the browser at the backend directly: the fetch() calls
# originate in the USER'S BROWSER, outside the compose network, so a Docker service
# hostname like http://backend:8000 is unresolvable there. Proxying under the same
# origin the app is served from fixes that, and as a side effect means no cross-origin
# request is ever made — so the backend's CORS middleware is not involved at all.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Vite emits content-hashed filenames, so built assets are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API -> backend service on the internal compose network. The backend is NOT
    # published to the host in docker-compose.prod.yml; this is its only route in.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A real scan+analyze round trip is long-running (website_scan alone has been
        # measured at 20-80s, and llm_analysis has its own 480s wall-clock budget), so
        # the default 60s proxy timeout would cut off legitimate in-flight requests.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering       off;
    }

    # SPA history fallback: any non-asset path serves index.html so client-side
    # routing works on refresh/deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

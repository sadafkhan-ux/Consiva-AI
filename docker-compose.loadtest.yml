  api-lt:
    image: consiva-backend:latest
    command: ["python", "-m", "loadtest.run_api"]
    volumes: ["./backend/loadtest:/app/loadtest:ro"]
    env_file: [./backend/.env]
    environment:
      APP_ENV: "${APP_ENV:?set APP_ENV}"
      DATABASE_URL: postgresql+asyncpg://consiva:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/consiva
      LOADTEST_FIXTURE_HOST: fixture
      DB_POOL_SIZE: "${BACKEND_DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${BACKEND_DB_MAX_OVERFLOW:-10}"
    networks: [consiva]
    depends_on: [fixture]

  worker-lt:
    image: consiva-backend:latest
    command: ["python", "-m", "loadtest.run_worker"]
    volumes: ["./backend/loadtest:/app/loadtest:ro"]
    init: true
    env_file: [./backend/.env]
    environment:
      APP_ENV: "${APP_ENV:?set APP_ENV}"
      DATABASE_URL: postgresql+asyncpg://consiva:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/consiva
      LOADTEST_FIXTURE_HOST: fixture
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-0}"
      DB_POOL_SIZE: "${WORKER_DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${WORKER_DB_MAX_OVERFLOW:-5}"
    shm_size: "4gb"
    networks: [consiva]
    depends_on: [fixture]

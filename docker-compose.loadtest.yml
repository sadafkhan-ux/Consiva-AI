# Load-test stack: the fixture sites, a copy of the API and any number of workers that resolve every name to the fixture (backend/loadtest/patch.py).
# Use it WITHOUT the normal worker, which would pick the test scans up and fail them (it refuses private addresses, correctly):
#
#   docker compose -f docker-compose.prod.yml stop worker
#   docker compose -f docker-compose.prod.yml -f docker-compose.loadtest.yml up -d --build fixture api-lt
#   docker compose -f docker-compose.prod.yml -f docker-compose.loadtest.yml up -d --scale worker-lt=N worker-lt
#   docker compose -f docker-compose.prod.yml -f docker-compose.loadtest.yml exec api-lt python -m loadtest.run_load
#
# Test tooling only: never part of a deployment.
services:
  fixture:
    image: consiva-backend:latest
    command: ["python", "-m", "loadtest.run_fixture"]
    environment:
      LOADTEST_HEAVY: "${LOADTEST_HEAVY:-0}"
      LOADTEST_BUSY_MS: "${LOADTEST_BUSY_MS:-220}"
    volumes: ["./backend/loadtest:/app/loadtest:ro"]
    # Real DNS names on the container network: robots.txt, the sitemap and the policy fetch go through Node/Python HTTP clients, which ignore the browser's resolver rule.
    networks:
      consiva:
        aliases:
          - site-000.loadtest.example
          - site-001.loadtest.example
          - site-002.loadtest.example
          - site-003.loadtest.example
          - site-004.loadtest.example

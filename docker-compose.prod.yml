# Consiva Consent Agent -- production compose.
#
# DEPLOY (this one command builds, migrates, starts, and waits until everything is healthy):
#
#   docker compose -f docker-compose.prod.yml up -d --build --wait
#
# or `scripts/deploy.sh`, which wraps it with pre-flight checks and prints what failed.
# There is NO separate migration command: the `migrate` service below runs first, on every
# deployment, and nothing that serves traffic starts until it has succeeded.
#
# Services, in start order:
#   db       -- local Postgres + pgvector (see below)
#   migrate  -- ONE-SHOT. Runs `python migrate.py` from the same image as the API, then exits.
#               Exit 0 = schema is current (or already was). Non-zero = a migration failed and
#               was rolled back; compose then refuses to start backend/worker/frontend, and
#               `up` returns non-zero. See docs/DEPLOYMENT.md for how to read and recover from it.
#   backend  -- FastAPI API.            Starts only after `migrate` completed successfully.
#   worker   -- app.jobs.worker.        Starts only after `migrate` AND a healthy backend.
#   frontend -- nginx serving the SPA, and the ONLY published entrypoint. After a healthy backend.
#
# Requires Docker Compose >= 2.20 (`depends_on: condition: service_completed_successfully`).
# scripts/deploy.sh checks this and refuses to continue on an older one.
#
# `worker` is not optional: scans and analyses are enqueued by the API and executed by
# that separate polling process. Without it every scan sits at status "pending"
# forever (the exact "Timed out waiting for the backend" symptom seen in development).
#
# There is deliberately NO scheduler service -- the periodic sweeps (DSR/incident SLA,
# regulatory due-sources, monitoring, stale-job reaping) run inside `worker`. The other
# __main__ entrypoints in the project (app.rag.ingest, app.lookup.loader, create_user.py)
# are one-shot CLI tools, not daemons.
#
# WHY `migrate` IS A SEPARATE SERVICE and not a step in backend/worker's command: the API and
# the worker are the same image started together, and any container that ran migrations on
# its own startup would race the other (and every restart would re-run them). One service,
# one lock (migrate.py takes a Postgres advisory lock), one place a failure is reported.
#
# `db` (2026-09-09): moved off the external Supabase project onto this local Postgres
# container -- the shared Supabase session-mode pooler caps the whole project at 15
# client connections, and this GB10 deployment (backend + worker, both always-on) was
# competing for that same tiny budget with every local dev machine hitting it at once
# (EMAXCONNSESSION seen repeatedly). `pgvector/pgvector:pg16` is used because it ships
# the vector extension the RAG retrieval step needs (see migrations/0001_init.sql)
# out of the box, on both amd64 and arm64 (GB10 is aarch64) -- no separate extension
# build/install step, unlike a plain postgres image.
#
# A FRESH `db` volume needs nothing by hand any more. The `auth.jwt()` stub this header used to
# ask for is obsolete: migration 0001 no longer references the Supabase `auth` schema (CI builds
# the whole schema from an empty vanilla Postgres), so `migrate` creates everything itself.
#
# DATABASE_URL is forced via `environment:` below (overriding whatever is in
# backend/.env, which still carries the old Supabase URL as a commented fallback) so
# no per-host .env edit is needed -- just this file plus POSTGRES_PASSWORD. The SAME value is
# used by migrate, backend and worker (one anchor, below), so a migration can never run against a
# different database than the one the application then reads.
#
# Existing database whose migration history is empty (built by hand, or from a dump)? `migrate`
# REFUSES to run rather than guess -- see docs/DEPLOYMENT.md, "Existing databases".

name: consiva

# The one database URL (the OWNER role) that migrate, backend and worker all use. Defined once so
# the three cannot drift. Never put a literal password here: it comes from /opt/consiva/.env.
x-database-url: &database_url postgresql+asyncpg://consiva:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/consiva/.env}@db:5432/consiva

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: consiva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/consiva/.env}
      POSTGRES_DB: consiva
    volumes:
      - consiva-db-data:/var/lib/postgresql/data
    # Not published to the host -- only backend/worker on the internal network reach
    # it, same "not exposed" posture as backend's own 8000 below.
    networks:
      - consiva
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consiva -d consiva"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot schema migration. Same image as backend/worker (no second image to keep in sync), run
  # with no command override so it is exactly `python migrate.py`. It receives ONLY the database
  # URL and its own tuning knobs -- not backend/.env -- because it needs nothing else and should
  # not carry the application's secrets.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: consiva-backend:latest
    # "no": a one-shot job must never be restarted by the engine -- a failed migration is a
    # deployment failure to be read and fixed, not something to retry in a loop.
    restart: "no"
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: *database_url
      # How long to keep retrying if Postgres is up but not yet accepting connections.
      MIGRATE_WAIT_FOR_DB_SECONDS: "${MIGRATE_WAIT_FOR_DB_SECONDS:-120}"
      # How long to wait for a concurrent migration run (another deployment) to finish.
      MIGRATE_LOCK_TIMEOUT_SECONDS: "${MIGRATE_LOCK_TIMEOUT_SECONDS:-300}"
      # Per-migration Postgres lock_timeout: fail clearly rather than hang behind a long query.
      MIGRATE_DDL_LOCK_TIMEOUT_SECONDS: "${MIGRATE_DDL_LOCK_TIMEOUT_SECONDS:-60}"
    networks:
      - consiva
    depends_on:
      db:
        condition: service_healthy
    # The image defines an HTTP HEALTHCHECK for the API; a job that runs and exits has no server to
    # probe, and the container is not "unhealthy" for being finished.
    healthcheck:
      disable: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: consiva-backend:latest
    restart: unless-stopped
    # Secrets come from backend/.env at RUN time (never baked into the image, and
    # excluded from the build context by backend/.dockerignore).
    env_file:
      - ./backend/.env
    environment:
      # Connections the API may hold. The application default (3 + 2) was sized for a 15-connection hosted pooler; on this deployment's own database (100 connections)
      # it let five simultaneous requests exhaust it. Every request now returns its connection before doing slow work, and 10 + 10 lets a hundred or more people
      # poll their scans at once. Add up the services before raising: backend + each worker replica (WORKER_DB_POOL_SIZE + WORKER_DB_MAX_OVERFLOW) must stay
      # under the database's max_connections, or put a connection pooler (PgBouncer) in front. See docs/SCALING.md.
      DB_POOL_SIZE: "${BACKEND_DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${BACKEND_DB_MAX_OVERFLOW:-10}"
      # Explicit override point; everything else is inherited from env_file above.
      #
      # This used to be pinned to development because the SPA's only auth path was
      # POST /api/v1/dev/demo-token, which the application hard-gates to
      # APP_ENV=development -- meaning anyone who reached the URL could mint a token.
      # The frontend now signs in against /api/v1/auth/login (first-party auth,
      # migrations/0010_local_auth.sql), so APP_ENV=production is safe once at least
      # one user exists:
      #   docker compose -f docker-compose.prod.yml run --rm backend \
      #     python create_user.py --email you@example.com --org "Your Org" --admin
      # No default. This used to fall back to development, which meant a stack brought
      # up without APP_ENV set -- from a file named .prod -- registered the dev token
      # minter and handed a valid token to anyone who reached the URL. Compose now
      # refuses to start until the value is stated, the same fail-closed treatment
      # POSTGRES_PASSWORD already gets below.
      #
      # The QUOTES are load-bearing. `(use: production)` contains a colon-space, and
      # an unquoted YAML scalar containing `: ` scans as the start of a nested
      # mapping -- the document then fails to load entirely and `docker compose`
      # refuses every command, including the `down` you reach for to recover.
      APP_ENV: "${APP_ENV:?set APP_ENV in /opt/consiva/.env (use: production)}"
      # true = no login screen: every visitor is signed in as the oldest user, with
      # that user's full access. See Settings.open_access in backend/app/config.py.
      OPEN_ACCESS: ${OPEN_ACCESS:-false}
      # Overrides whatever DATABASE_URL is in backend/.env (still the old Supabase URL,
      # kept there as a commented fallback) -- always point this deployment at the
      # local `db` service instead. See the `db` service comment above.
      #
      # ROW-LEVEL SECURITY: THIS URL IS NOT YET CUT OVER.
      # ------------------------------------------------
      # `consiva` here is the database owner. Owners bypass their own RLS policies
      # unless FORCE is set, and a superuser bypasses them unconditionally -- so with
      # this URL the 61 forced policies from migration 0018 are never consulted and
      # tenant isolation rests entirely on every query carrying its own org_id filter.
      # The API now REFUSES TO START in production on such a role (see
      # app/db/privilege_check.py), which is why the escape hatch below exists.
      #
      # To complete the cutover on this deployment:
      #   docker compose -f docker-compose.prod.yml exec db       #     psql -U consiva -c "alter role consiva_app login password '<generated>'"
      # then swap the two lines below and drop ALLOW_PRIVILEGED_DB_ROLE:
      #   DATABASE_URL: postgresql+asyncpg://consiva_app:${CONSIVA_APP_PASSWORD}@db:5432/consiva
      #   WORKER_DATABASE_URL stays on the owner -- see the worker service.
      DATABASE_URL: *database_url
      # Deliberate, temporary, and loud: without it this stack will not boot, because
      # the role above cannot enforce RLS. Remove it the moment the cutover above is
      # done. Every boot logs at ERROR while this is set.
      ALLOW_PRIVILEGED_DB_ROLE: "i-accept-no-database-tenant-isolation"
      # Signs and verifies login tokens (app/core/tokens.py). Passed explicitly from
      # /opt/consiva/.env, like POSTGRES_PASSWORD above, because that file is read by
      # compose for interpolation and is NOT the same file as the `env_file:
      # ./backend/.env` the container inherits -- putting the secret in the wrong one
      # is easy, and the symptom is a 500 at login rather than anything obvious.
      # `:?` makes the stack refuse to start without it instead of failing later.
      CONSIVA_JWT_SECRET: ${CONSIVA_JWT_SECRET:?set CONSIVA_JWT_SECRET in /opt/consiva/.env}
      # ---- Consent Agent integration API (/api/v1/consent-agent) --------------
      #
      # Passed explicitly for the reason CONSIVA_JWT_SECRET above is: /opt/consiva/.env
      # is read by COMPOSE for ${...} interpolation and is NOT the file the container
      # inherits (that is env_file: ./backend/.env). A value put in the wrong one is
      # silently invisible, and the symptom is never "missing config" -- it is a
      # browser CORS failure the website team cannot diagnose from their side.
      #
      # Browser origins allowed to call this API, comma-separated. Empty by default,
      # which is correct for a server with no browser client; the website team's
      # origin must be added here before their integration can work at all. Never "*":
      # this API is credentialed and browsers reject a wildcard on a credentialed
      # request anyway, so a wildcard would look permissive while being broken.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      # Signs outbound scan-completion webhooks (HMAC-SHA256, X-Consiva-Signature).
      # Optional: unset means the API REFUSES a scan that asks for a webhook, with
      # 501 WEBHOOK_NOT_CONFIGURED, rather than delivering something the receiver
      # cannot authenticate. Polling needs no secret and is unaffected.
      WEBHOOK_SIGNING_SECRET: "${WEBHOOK_SIGNING_SECRET:-}"
      # Scans per organisation per hour through the integration API, on top of the
      # existing per-day ceiling. A scan is a real browser crawl plus a model call.
      CONSENT_API_SCANS_PER_HOUR: "${CONSENT_API_SCANS_PER_HOUR:-0}"
    volumes:
      # Source PDFs for the RAG knowledge base. Read-only, and deliberately a mount
      # rather than a COPY: they live at the repo root, outside this service's
      # ./backend build context, and they are ingest-time input rather than
      # application code. Without this, `python -m app.rag.ingest` inside the
      # container has no files to ingest and DPDP citations stay empty.
      - ./knowledge_sources:/app/knowledge_sources:ro
    # Not published to the host: the browser reaches the API through the frontend's
    # nginx proxy on the shared network, so there is no reason to expose port 8000.
    expose:
      - "8000"
    networks:
      - consiva
    depends_on:
      db:
        condition: service_healthy
      # The API must never serve traffic against a schema that is still changing, or one a failed
      # migration left behind. `service_completed_successfully` means exit code 0 -- anything
      # else (a failed migration, an unreachable database, a refused unsafe state) keeps this
      # service from being created at all.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # The PDF report endpoint runs Chromium in this container; Docker's default 64 MB /dev/shm crashes it on a large report (the worker has the same).
    shm_size: "1gb"

  worker:
    # Same image as the backend — same application, different entrypoint. `build` is
    # repeated so `compose build` works regardless of service order; the identical
    # image tag means it is built once and reused, not twice.
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: consiva-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.worker"]
    # Every scan starts Chromium, and a browser that is killed or crashes leaves child processes behind. As PID 1 the worker does not reap them, so over days of
    # scans they pile up as zombies; a minimal init (tini) in front of it does, and also passes SIGTERM through for the graceful shutdown below.
    init: true
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: "${APP_ENV:?set APP_ENV in /opt/consiva/.env (use: production)}"
      # Same override as backend -- see the `db` service comment above.
      #
      # The worker STAYS on the privileged role even after the API cuts over. It is
      # deliberately cross-tenant: the DSR and incident SLA sweeps and the regulatory
      # due-source sweep walk every organisation's rows and have no single org_id to
      # scope to. On the restricted role they would correctly see nothing and stop
      # sweeping silently -- the worst way for a compliance sweep to stop. After the
      # cutover, set WORKER_DATABASE_URL to this same value; worker.py prefers it.
      DATABASE_URL: *database_url
      # How many queued jobs this worker runs at once. Before this existed the worker
      # took one job per poll and ran it inline, so a second scan waited out the
      # first: two scans started 48s apart were measured at 73s of pure queue time
      # and 151s end to end, which is what made the UI report a backend timeout over
      # a scan that completed fine.
      #
      # 0 = decide from the machine (app/jobs/capacity.py): at most one job per CPU, and
      # a new one is taken only while the CPU is under WORKER_TARGET_CPU_PERCENT (85) and
      # memory remains for it, a step at a time. A fixed 4 left a large idle machine
      # mostly unused while 100 scans waited (median 86 s in the queue at 32% CPU) and
      # was already too many on a small one (four real scans measured 790% of eight
      # cores). A number above 0 caps it instead; the CPU and memory limits still apply.
      # /dev/shm below still has to hold every browser: it is scaled with the slots.
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-0}"
      # Must be raised WITH WORKER_CONCURRENCY. The app default is 3+2=5 connections
      # per process, sized years ago for Supabase's 15-client session pooler; this
      # deployment is on the local `db` container instead, where max_connections is
      # 100. Four concurrent jobs plus the maintenance loop plus the pump's own claim
      # query would contend on a 5-connection pool and block for pool_timeout, so the
      # worker gets 10+5. With the backend's 5 that is 20 of 100.
      DB_POOL_SIZE: "${WORKER_DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${WORKER_DB_MAX_OVERFLOW:-5}"
      # The worker is what actually DELIVERS the webhook (job_type consent_webhook),
      # so it needs the same secret the API validated the request against. Setting it
      # only on the backend produces the worst shape of this bug: the scan is accepted
      # because the API sees a secret, and every delivery then goes out unsigned from
      # a process that has none.
      WEBHOOK_SIGNING_SECRET: "${WEBHOOK_SIGNING_SECRET:-}"
    networks:
      - consiva
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      # Stated explicitly even though backend already implies it: the worker is the process that
      # runs the cross-tenant sweeps, and it must not start on a schema that failed to migrate
      # regardless of how backend's own dependencies are ever changed.
      migrate:
        condition: service_completed_successfully
    # The worker launches Chromium for every scan. Chromium's sandbox needs more than
    # Docker's default 64MB /dev/shm or it crashes on content-heavy pages -- and with
    # WORKER_CONCURRENCY scans now overlapping, several Chromiums share this one
    # tmpfs, so the 1gb that sufficed for a strictly serial worker is scaled with it.
    shm_size: "4gb"
    # A scan in flight is worth finishing. On SIGTERM the worker stops claiming new
    # jobs and drains what is running (jobs/worker.py's _job_pump), so the grace
    # period needs to cover a realistic scan -- observed at 78s and 120s -- rather
    # than Docker's default 10s, which would SIGKILL every in-flight scan on any
    # ordinary restart and leave the rows for reap_stale_jobs to recover ten minutes
    # later. Not the 870s worst case a scan is budgeted for: past this the blunt stop
    # plus the reaper is the right trade against blocking a deploy.
    stop_grace_period: 180s
    # The shared image defines an HTTP HEALTHCHECK against /health, which is correct
    # for the `backend` service but meaningless here: this container runs the polling
    # worker, not uvicorn, so nothing is listening on 8000 and the probe can never
    # pass. Left enabled it reported a perfectly healthy worker as "unhealthy"
    # indefinitely. Liveness for this process is simply "did it exit" -- which
    # restart: unless-stopped already handles.
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty => the SPA issues same-origin /api/... requests, which nginx proxies to
        # the backend. Set this only if the API is published on a different public
        # origin than the frontend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
        # Must match the backend's OPEN_ACCESS: a bundle that auto-logs in against a
        # backend without the endpoint just falls back to the login form.
        VITE_OPEN_ACCESS: ${OPEN_ACCESS:-false}
    image: consiva-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - consiva
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  consiva:
    driver: bridge

volumes:
  consiva-db-data:
